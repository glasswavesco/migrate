name: Glasswaves migration drivers
on:
  push:
    branches: [glasswaves/dsql-postgres-compat]
  pull_request:
permissions:
  contents: read
jobs:
  drivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./database/dsql ./database/pgx/v5
      - run: go test -tags 'dsql pgx5' ./internal/cli ./cmd/migrate
      - run: go vet ./database/dsql ./database/pgx/v5
